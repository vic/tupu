name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tupu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build
      - run: nix flake check
      # the bench reports only: shared runners are noisy, so no run fails on time
      - run: nix develop -c just bench
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench/out/*.json
